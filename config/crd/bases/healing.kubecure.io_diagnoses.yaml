---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: diagnoses.healing.kubecure.io
spec:
  group: healing.kubecure.io
  names:
    kind: Diagnosis
    listKind: DiagnosisList
    plural: diagnoses
    shortNames:
    - diag
    singular: diagnosis
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.target.name
      name: Target
      type: string
    - jsonPath: .spec.failureType
      name: Type
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.hypotheses[0].confidencePercent
      name: Conf
      type: integer
    - jsonPath: .status.plan.selected.type
      name: Action
      type: string
    - jsonPath: .status.timeToDiagnosis
      name: MTTD
      type: string
    - jsonPath: .status.timeToRecovery
      name: MTTR
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Diagnosis is a single detected pod failure and the record of
          how it was handled.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DiagnosisSpec records the observed facts of a single failure. It is written once when the failure
              is detected and is never modified afterwards; all subsequent progress is recorded in the status.
            properties:
              container:
                description: |-
                  Container names the failing container within the pod. Empty for pod level failures such as
                  eviction or unschedulability.
                type: string
              failureType:
                description: FailureType is the classification assigned by the detector.
                enum:
                - CrashLoopBackOff
                - OOMKilled
                - ImagePullBackOff
                - CreateContainerConfigError
                - RunContainerError
                - Unschedulable
                - ProbeFailure
                - Evicted
                type: string
              observedAt:
                description: ObservedAt is when the detector first saw the failure.
                format: date-time
                type: string
              policyRef:
                description: |-
                  PolicyRef names the HealingPolicy in this namespace that governs handling. Empty means no
                  policy was found, in which case the diagnosis is recorded but no remediation is attempted.
                type: string
              signature:
                description: |-
                  Signature is a hash over namespace, owner, container, and failure type. Object names derive
                  from it, so replicas failing identically collapse into a single diagnosis.
                type: string
              target:
                description: Target is the pod that failed.
                properties:
                  name:
                    description: Name is the pod name.
                    type: string
                  owner:
                    description: |-
                      Owner is the workload that manages the pod, and is where a fix is normally applied. Pods
                      created directly have no owner.
                    properties:
                      kind:
                        description: Kind is the owning workload kind, such as Deployment
                          or StatefulSet.
                        type: string
                      name:
                        description: Name is the owning workload name.
                        type: string
                    required:
                    - kind
                    - name
                    type: object
                  uid:
                    description: UID is the pod's unique identifier.
                    type: string
                required:
                - name
                - uid
                type: object
            required:
            - failureType
            - observedAt
            - signature
            - target
            type: object
          status:
            description: DiagnosisStatus is the observed progress of a diagnosis.
              Only controllers write it.
            properties:
              conditions:
                description: Conditions carries standard condition entries for detailed
                  state and error reporting.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              evidence:
                description: Evidence is the gathered diagnostic context.
                properties:
                  complete:
                    description: |-
                      Complete reports that every required item was collected. When false, any conclusion drawn is
                      a best effort and its confidence is capped accordingly.

                      This field is serialised even when false: an absent value and an explicit false would
                      otherwise be indistinguishable, which is exactly the ambiguity this stage exists to remove.
                    type: boolean
                  exitCode:
                    description: ExitCode is the previous instance's exit status,
                      when the container terminated.
                    format: int32
                    type: integer
                  items:
                    description: |-
                      Items is the outcome of every requirement for this failure type, whether or not it produced
                      content.
                    items:
                      description: |-
                        EvidenceItem is one piece of gathered context, together with whether it was required and what
                        happened when it was sought.
                      properties:
                        content:
                          description: |-
                            Content is the gathered material, truncated to keep the object well inside API server size
                            limits. Content is captured rather than referenced because a failing pod may be deleted before
                            analysis runs, after which its logs are unrecoverable.
                          maxLength: 8192
                          type: string
                        kind:
                          description: |-
                            EvidenceKind names a category of diagnostic context. Requirements are declared per failure type,
                            so what is gathered depends on what the failure actually needs.
                          enum:
                          - PreviousLogs
                          - CurrentLogs
                          - Events
                          - WorkloadSpec
                          - RolloutHistory
                          - ConfigReferences
                          - ServiceEndpoints
                          - NodeStatus
                          - SiblingPods
                          - ResourceUsage
                          type: string
                        reason:
                          description: Reason explains a status of NotApplicable or
                            Unavailable.
                          maxLength: 512
                          type: string
                        required:
                          description: |-
                            Required reports whether the requirement matrix considers this item necessary for the
                            failure type under diagnosis.
                          type: boolean
                        status:
                          description: |-
                            CollectionStatus distinguishes evidence that was gathered, evidence that cannot exist for this
                            failure, and evidence that should exist but could not be obtained. Collapsing the last two would
                            make a confidence score uninterpretable, since it would hide what a conclusion was reached
                            without.
                          enum:
                          - Collected
                          - NotApplicable
                          - Unavailable
                          type: string
                      required:
                      - kind
                      - status
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - kind
                    x-kubernetes-list-type: map
                  missingRequired:
                    description: MissingRequired names required items that could not
                      be obtained.
                    items:
                      description: |-
                        EvidenceKind names a category of diagnostic context. Requirements are declared per failure type,
                        so what is gathered depends on what the failure actually needs.
                      enum:
                      - PreviousLogs
                      - CurrentLogs
                      - Events
                      - WorkloadSpec
                      - RolloutHistory
                      - ConfigReferences
                      - ServiceEndpoints
                      - NodeStatus
                      - SiblingPods
                      - ResourceUsage
                      type: string
                    type: array
                  redactedFields:
                    description: |-
                      RedactedFields counts values removed before storage. A non zero count means sensitive material
                      was present in the gathered content and did not leave the cluster.
                    format: int32
                    type: integer
                  restartCount:
                    description: RestartCount is the container's restart count at
                      collection time.
                    format: int32
                    type: integer
                  terminationReason:
                    description: TerminationReason is the reason reported for the
                      previous termination, such as OOMKilled.
                    type: string
                  waitingReason:
                    description: |-
                      WaitingReason is the reason the container is currently not running, such as CrashLoopBackOff.
                      This is the symptom the cluster displays, retained alongside the classified cause.
                    type: string
                type: object
              hypotheses:
                description: Hypotheses are the ranked candidate explanations produced
                  by the investigation.
                items:
                  description: |-
                    Hypothesis is one candidate explanation for a failure. Investigations emit several, ranked, so
                    that what was considered and rejected is visible rather than hidden behind a single score.
                  properties:
                    confidencePercent:
                      description: |-
                        ConfidencePercent expresses certainty from 0 to 100. Integers are used throughout, since the
                        Kubernetes API conventions discourage floating point fields.
                      format: int32
                      maximum: 100
                      minimum: 0
                      type: integer
                    evidenceCitations:
                      description: |-
                        EvidenceCitations names the specific observations supporting this hypothesis. A hypothesis
                        citing nothing cannot survive judgement, which is what keeps reasoning auditable.
                      items:
                        type: string
                      type: array
                    id:
                      description: ID identifies this hypothesis within the diagnosis,
                        so a verdict and a plan can reference it.
                      type: string
                    proposedActions:
                      description: ProposedActions are the remediations this explanation
                        would imply, before ranking.
                      items:
                        description: |-
                          Action is a single proposed change, produced by an analyzer and executed by a remediator.
                          It carries no manifest content: the remediator maps the type to a hand written handler, so the
                          blast radius of any proposal is limited to the actions implemented here.
                        properties:
                          container:
                            description: Container names the container within the
                              pod spec that the action targets.
                            type: string
                          type:
                            description: Type selects which remediation handler applies.
                            enum:
                            - SetMemoryLimit
                            - SetCPULimit
                            - SetImage
                            - SetProbeDelay
                            - SetProbePort
                            - AddResourceRequests
                            - RollbackToRevision
                            - RestartWorkload
                            - None
                            type: string
                          value:
                            description: |-
                              Value is the action's parameter, interpreted per action type. Examples: "384Mi" for a memory
                              limit, "nginx:1.27.3" for an image, "60" for a probe delay in seconds.
                            maxLength: 253
                            type: string
                        required:
                        - type
                        type: object
                      type: array
                    rank:
                      description: Rank orders hypotheses, with 1 being the investigation's
                        preferred explanation.
                      format: int32
                      minimum: 1
                      type: integer
                    rootCause:
                      description: RootCause explains the failure in a form suitable
                        for a pull request description.
                      maxLength: 2048
                      type: string
                  required:
                  - confidencePercent
                  - id
                  - rank
                  - rootCause
                  type: object
                type: array
              investigation:
                description: Investigation records how the analysis was performed
                  and what it consumed.
                properties:
                  agentic:
                    description: |-
                      Agentic reports whether this was a goal directed loop with tool selection, as opposed to a
                      deterministic evaluation or a single model call.
                    type: boolean
                  budgetExhausted:
                    description: |-
                      BudgetExhausted reports that the loop stopped on a limit rather than on a conclusion, which
                      means the result is a best effort.
                    type: boolean
                  costMicroUSD:
                    description: |-
                      CostMicroUSD is the spend in millionths of a dollar, stored as an integer to avoid floating
                      point fields.
                    format: int64
                    type: integer
                  durationMillis:
                    format: int64
                    type: integer
                  provider:
                    description: Provider names the analyzer, such as the rule engine
                      or a model backend.
                    type: string
                  tokensUsed:
                    format: int32
                    type: integer
                  toolCalls:
                    description: ToolCalls is the ordered record of reads performed.
                    items:
                      description: |-
                        ToolCall records one read performed during an investigation. The sequence forms the audit trail
                        of how a conclusion was reached.
                      properties:
                        arguments:
                          maxLength: 512
                          type: string
                        durationMillis:
                          format: int64
                          type: integer
                        error:
                          type: string
                        summary:
                          description: Summary is a short description of what the
                            call returned, not the full payload.
                          maxLength: 512
                          type: string
                        tool:
                          type: string
                      required:
                      - tool
                      type: object
                    type: array
                required:
                - agentic
                - provider
                type: object
              judgement:
                description: Judgement is the review of those hypotheses against their
                  cited evidence.
                properties:
                  provider:
                    type: string
                  selectedHypothesisID:
                    description: SelectedHypothesisID is the surviving hypothesis
                      carried forward, empty when none survived.
                    type: string
                  verdicts:
                    items:
                      description: Verdict is the judgement passed on a single hypothesis.
                      properties:
                        adjustedConfidencePercent:
                          description: AdjustedConfidencePercent is the confidence
                            after review, which may be lower than claimed.
                          format: int32
                          maximum: 100
                          minimum: 0
                          type: integer
                        hypothesisID:
                          type: string
                        reasoning:
                          maxLength: 1024
                          type: string
                        supported:
                          description: Supported reports whether the cited evidence
                            actually establishes the claim.
                          type: boolean
                      required:
                      - hypothesisID
                      - supported
                      type: object
                    type: array
                required:
                - provider
                type: object
              observedGeneration:
                description: ObservedGeneration is the spec generation most recently
                  reconciled.
                format: int64
                type: integer
              phase:
                description: Phase is the current pipeline stage.
                enum:
                - Detected
                - Enriched
                - Hypothesized
                - Judged
                - Planned
                - Remediating
                - Verifying
                - Healed
                - Failed
                - AwaitingHuman
                type: string
              plan:
                description: Plan is the selected remediation and the candidates considered.
                properties:
                  candidates:
                    description: |-
                      Candidates records every action considered and how it scored, so a rejected option is visible
                      alongside the chosen one.
                    items:
                      description: |-
                        RankedAction is a candidate remediation scored on the dimensions that determine the cost of being
                        wrong. These are evaluated independently of diagnostic confidence.
                      properties:
                        action:
                          description: |-
                            Action is a single proposed change, produced by an analyzer and executed by a remediator.
                            It carries no manifest content: the remediator maps the type to a hand written handler, so the
                            blast radius of any proposal is limited to the actions implemented here.
                          properties:
                            container:
                              description: Container names the container within the
                                pod spec that the action targets.
                              type: string
                            type:
                              description: Type selects which remediation handler
                                applies.
                              enum:
                              - SetMemoryLimit
                              - SetCPULimit
                              - SetImage
                              - SetProbeDelay
                              - SetProbePort
                              - AddResourceRequests
                              - RollbackToRevision
                              - RestartWorkload
                              - None
                              type: string
                            value:
                              description: |-
                                Value is the action's parameter, interpreted per action type. Examples: "384Mi" for a memory
                                limit, "nginx:1.27.3" for an image, "60" for a probe delay in seconds.
                              maxLength: 253
                              type: string
                          required:
                          - type
                          type: object
                        addressesRecentChange:
                          description: |-
                            AddressesRecentChange reports that this action undoes a change made shortly before the
                            failure began. Reverting a recent change is preferred over a novel forward fix.
                          type: boolean
                        blastRadius:
                          description: |-
                            BlastRadius is how much of the cluster a remediation can affect if it is wrong. It is deliberately
                            distinct from diagnostic confidence: confidence measures certainty about the cause, blast radius
                            measures the cost of being mistaken.
                          enum:
                          - Pod
                          - Workload
                          - Namespace
                          - Cluster
                          type: string
                        policyEligible:
                          description: PolicyEligible reports whether the governing
                            policy permits this action type.
                          type: boolean
                        reversibility:
                          description: Reversibility is how quickly a remediation
                            can be undone if it proves wrong.
                          enum:
                          - Instant
                          - Rollout
                          - Irreversible
                          type: string
                        score:
                          description: Score is the composite safety ranking, higher
                            being safer and more preferred.
                          format: int32
                          maximum: 100
                          minimum: 0
                          type: integer
                      required:
                      - action
                      - blastRadius
                      - policyEligible
                      - reversibility
                      - score
                      type: object
                    type: array
                  decision:
                    description: PlanDecision is the outcome of evaluating candidate
                      actions against policy.
                    enum:
                    - Apply
                    - Defer
                    - NoAction
                    type: string
                  reason:
                    maxLength: 1024
                    type: string
                  selected:
                    description: Selected is the action chosen for execution, absent
                      when the decision is NoAction.
                    properties:
                      container:
                        description: Container names the container within the pod
                          spec that the action targets.
                        type: string
                      type:
                        description: Type selects which remediation handler applies.
                        enum:
                        - SetMemoryLimit
                        - SetCPULimit
                        - SetImage
                        - SetProbeDelay
                        - SetProbePort
                        - AddResourceRequests
                        - RollbackToRevision
                        - RestartWorkload
                        - None
                        type: string
                      value:
                        description: |-
                          Value is the action's parameter, interpreted per action type. Examples: "384Mi" for a memory
                          limit, "nginx:1.27.3" for an image, "60" for a probe delay in seconds.
                        maxLength: 253
                        type: string
                    required:
                    - type
                    type: object
                required:
                - decision
                type: object
              remediation:
                description: Remediation is the record of what was attempted.
                properties:
                  applied:
                    description: |-
                      Applied reports whether a change was actually made. False in dry run mode, and false when the
                      confidence gate or the allowed action list rejected the proposal.
                    type: boolean
                  mode:
                    description: Mode is the remediation strategy that applied.
                    enum:
                    - DryRun
                    - PullRequest
                    - Direct
                    type: string
                  patch:
                    description: |-
                      Patch is the computed change in a human readable form. Recorded in every mode, including dry
                      run, so the proposal can be reviewed without applying it.
                    maxLength: 4096
                    type: string
                  reference:
                    description: Reference points at the resulting artifact, such
                      as a pull request URL.
                    type: string
                  skipReason:
                    description: SkipReason explains why no change was made, when
                      Applied is false.
                    type: string
                  verified:
                    description: Verified reports the outcome of the recovery check.
                      Nil means verification has not completed.
                    type: boolean
                required:
                - applied
                - mode
                type: object
              timeToDiagnosis:
                description: |-
                  TimeToDiagnosis is the interval from detection to a recorded root cause, formatted for
                  display. Derived from Timings and stored so it can be surfaced as a printer column.
                type: string
              timeToRecovery:
                description: |-
                  TimeToRecovery is the interval from detection to verified recovery, formatted for display.
                  Populated only in direct mode, since pull request mode depends on human review the operator
                  does not control.
                type: string
              timings:
                description: Timings records stage completion times.
                properties:
                  detectedAt:
                    format: date-time
                    type: string
                  enrichedAt:
                    format: date-time
                    type: string
                  healedAt:
                    format: date-time
                    type: string
                  hypothesizedAt:
                    format: date-time
                    type: string
                  judgedAt:
                    format: date-time
                    type: string
                  plannedAt:
                    format: date-time
                    type: string
                  remediatedAt:
                    format: date-time
                    type: string
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
