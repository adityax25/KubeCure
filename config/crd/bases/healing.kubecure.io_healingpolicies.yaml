---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: healingpolicies.healing.kubecure.io
spec:
  group: healing.kubecure.io
  names:
    kind: HealingPolicy
    listKind: HealingPolicyList
    plural: healingpolicies
    shortNames:
    - hpol
    singular: healingpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.remediation.mode
      name: Mode
      type: string
    - jsonPath: .spec.remediation.minConfidence
      name: MinConf
      type: integer
    - jsonPath: .spec.analyzer.provider
      name: Analyzer
      type: string
    - jsonPath: .spec.agent.enabled
      name: Agent
      type: boolean
    - jsonPath: .status.activeDiagnoses
      name: Active
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HealingPolicy configures how KubeCure handles failures within
          its namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: HealingPolicySpec is the configuration governing how failures
              are handled in one namespace.
            properties:
              agent:
                description: Agent bounds the investigation loop.
                properties:
                  enabled:
                    default: false
                    description: |-
                      Enabled turns on goal directed investigation. When false, analysis is limited to the
                      deterministic rule engine, which requires no credentials and no network access.
                    type: boolean
                  judgeEnabled:
                    default: true
                    description: |-
                      JudgeEnabled turns on review of hypotheses against their cited evidence before any action is
                      considered. Disabling it removes the check that catches unsupported conclusions.
                    type: boolean
                  maxCostMicroUSD:
                    default: 50000
                    description: MaxCostMicroUSD caps spend per investigation in millionths
                      of a dollar.
                    format: int64
                    minimum: 1
                    type: integer
                  maxTokens:
                    default: 100000
                    description: |-
                      MaxTokens caps model token consumption for a single investigation, summed across every turn.
                      Each turn resends the conversation so far, so consumption grows faster than the number of
                      turns, and the default allows for a full investigation rather than a single call.
                    format: int32
                    minimum: 1000
                    type: integer
                  maxToolCalls:
                    default: 12
                    description: MaxToolCalls caps how many reads a single investigation
                      may perform.
                    format: int32
                    maximum: 50
                    minimum: 1
                    type: integer
                  timeoutSeconds:
                    default: 60
                    description: TimeoutSeconds caps wall clock time for a single
                      investigation.
                    format: int32
                    maximum: 600
                    minimum: 5
                    type: integer
                type: object
              analyzer:
                description: Analyzer configures root cause analysis.
                properties:
                  escalateToProvider:
                    description: |-
                      EscalateToProvider names an analyzer consulted when the rule engine finds no confident match.
                      Empty disables escalation, leaving unmatched failures without a root cause rather than a
                      guessed one.
                    enum:
                    - gemini
                    - ""
                    type: string
                  minRuleConfidence:
                    default: 70
                    description: |-
                      MinRuleConfidence is the confidence below which a rule result is treated as inconclusive and
                      escalation is considered.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  provider:
                    default: rules
                    description: Provider is the preferred analyzer. The rule engine
                      requires no credentials and no network.
                    enum:
                    - rules
                    - gemini
                    type: string
                type: object
              failureTypes:
                description: FailureTypes limits handling to the listed failure modes.
                  Empty means all supported modes.
                items:
                  description: |-
                    FailureType is a pod failure mode that KubeCure can detect and reason about.
                    Values map to conditions observable from container status, pod status, or scheduling events.
                  enum:
                  - CrashLoopBackOff
                  - OOMKilled
                  - ImagePullBackOff
                  - CreateContainerConfigError
                  - RunContainerError
                  - Unschedulable
                  - ProbeFailure
                  - Evicted
                  type: string
                type: array
              maxDiagnosesPerHour:
                default: 20
                description: |-
                  MaxDiagnosesPerHour caps how many new diagnoses may be opened in this namespace per hour,
                  bounding both analysis cost and object growth when a cluster is broadly unhealthy.
                format: int32
                minimum: 1
                type: integer
              remediation:
                description: Remediation configures whether and how fixes are applied.
                properties:
                  allowedActions:
                    description: |-
                      AllowedActions restricts which action types may be applied in this namespace. An action not
                      listed here is recorded but never executed, regardless of confidence.
                    items:
                      description: |-
                        ActionType is a remediation the operator knows how to perform. The set is deliberately closed:
                        an analyzer may only select from these, which bounds what any automated fix can change.
                      enum:
                      - SetMemoryLimit
                      - SetCPULimit
                      - SetImage
                      - SetProbeDelay
                      - SetProbePort
                      - AddResourceRequests
                      - RollbackToRevision
                      - RestartWorkload
                      - None
                      type: string
                    type: array
                  maxBlastRadius:
                    default: Workload
                    description: |-
                      MaxBlastRadius is the widest scope of change permitted here. Candidates affecting more than
                      this are recorded but never applied, regardless of how confident the diagnosis is.
                    enum:
                    - Pod
                    - Workload
                    - Namespace
                    - Cluster
                    type: string
                  minConfidence:
                    default: 85
                    description: |-
                      MinConfidence is the confidence required before an action is applied. Proposals below the
                      threshold are recorded and left for human review.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  mode:
                    default: DryRun
                    description: |-
                      Mode selects the remediation strategy. Dry run is the default so that a fresh install
                      observes and proposes without changing anything.
                    enum:
                    - DryRun
                    - PullRequest
                    - Direct
                    type: string
                  requireReversible:
                    default: true
                    description: |-
                      RequireReversible restricts automatic application to changes that can be undone. Confidence
                      measures certainty about the cause; this bounds the cost of being wrong about it.
                    type: boolean
                  verificationWindow:
                    default: 2m
                    description: |-
                      VerificationWindow is how long a remediated workload must stay healthy before the diagnosis
                      is considered resolved.
                    type: string
                type: object
              resolvedRetention:
                default: 24h
                description: ResolvedRetention is how long resolved diagnoses are
                  kept before deletion.
                type: string
            type: object
          status:
            description: HealingPolicyStatus is the observed state of a HealingPolicy.
            properties:
              activeDiagnoses:
                description: |-
                  ActiveDiagnoses is the number of diagnoses in this namespace that have not reached a terminal
                  phase.
                format: int32
                type: integer
              conditions:
                description: Conditions carries standard condition entries.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              diagnosesThisHour:
                description: DiagnosesThisHour is the count used to enforce MaxDiagnosesPerHour.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
