# This rule is not used by the project kubecure itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the healing.kubecure.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubecure
    app.kubernetes.io/managed-by: kustomize
  name: diagnosis-editor-role
rules:
- apiGroups:
  - healing.kubecure.io
  resources:
  - diagnoses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - healing.kubecure.io
  resources:
  - diagnoses/status
  verbs:
  - get
