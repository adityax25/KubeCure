---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - healing.kubecure.io
  resources:
  - diagnoses
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - healing.kubecure.io
  resources:
  - diagnoses/finalizers
  verbs:
  - update
- apiGroups:
  - healing.kubecure.io
  resources:
  - diagnoses/status
  verbs:
  - get
  - patch
  - update
