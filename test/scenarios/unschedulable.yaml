# The memory request exceeds the capacity of every node, so the scheduler cannot place the pod. It
# stays Pending with a PodScheduled condition of False and a reason of Unschedulable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unschedulable-indexer
  namespace: kubecure-demo
  labels:
    kubecure.io/scenario: unschedulable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unschedulable-indexer
  template:
    metadata:
      labels:
        app: unschedulable-indexer
        kubecure.io/scenario: unschedulable
    spec:
      containers:
        - name: indexer
          image: busybox:1.36
          command: ["sh", "-c", "sleep 600"]
          resources:
            requests:
              memory: 900Gi
